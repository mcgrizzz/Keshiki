name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    uses: mcgrizzz/Kiso/.github/workflows/addon-ci.yml@main
    with:
      floor-anki: "26.8.1"          # min_point_version 260800
      qt-checks: tools/qt_checks.sh
      # Off for now: CI's Windows runner is slow enough to trip the checks' timing. They pass on
      # a real Windows machine (run them there before a release).
      qt-checks-windows: false
